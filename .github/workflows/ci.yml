name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash -n scripts/*.sh
      - run: python3 -m py_compile scripts/install_ngrok.py
      - run: npm run test:hermetic
      - run: ./scripts/install.sh --dry-run --yes --no-start
